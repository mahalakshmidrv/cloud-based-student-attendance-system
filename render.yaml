services:
  - type: web
    name: cloud-student-attendance
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/attendance.db
    disk:
      name: attendance-data
      mountPath: /var/data
      sizeGB: 1
